<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | RentEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">RentEase.</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Explore Rooms</a>
            <a href="mybookings.html">My Bookings</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<section class="contact-section">

    <div class="contact-heading">
        <h1>Get In Touch</h1>
        <p>Have a question? Send us a message.</p>
    </div>

    <div class="contact-container">

        <div class="contact-info">
            <h2>Contact Information</h2>
            <p>We are here to help you find your perfect space.</p>

            <p>📧 support@rentease.com</p>
            <p>📍 Kharar, Punjab, India</p>
            <p>🕒 Monday - Saturday</p>
        </div>

        <form id="contactForm" class="contact-form">

            <label>Full Name</label>
            <input type="text" id="contactName"
                   placeholder="Your name" required>

            <label>Email Address</label>
            <input type="email" id="contactEmail"
                   placeholder="Your email" required>

            <label>Subject</label>
            <input type="text" id="contactSubject"
                   placeholder="Enter subject" required>

            <label>Your Message</label>
            <textarea id="contactMessage"
                      rows="5"
                      placeholder="Write your message..."
                      required></textarea>

            <button type="submit">Send Message</button>

            <p id="contactResponse"></p>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 RentEase. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>

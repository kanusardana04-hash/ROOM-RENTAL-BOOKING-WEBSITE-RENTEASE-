<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Rooms | RentEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">RentEase.</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Explore Rooms</a>
            <a href="mybookings.html">My Bookings</a>
            <a href="contact.html">Contact</a>
        </div>

        <a href="rooms.html" class="btn">Find a Room</a>
    </nav>
</header>

<section class="page-heading">
    <h1>Explore Available Rooms</h1>
    <p>Find a comfortable space that matches your needs and budget.</p>
</section>

<section class="search-section">
    <input type="text" id="roomLocation" placeholder="Enter location">

    <select id="roomBudget">
        <option value="">Any Budget</option>
        <option value="5000">Below ₹5,000</option>
        <option value="8000">Below ₹8,000</option>
        <option value="10000">Below ₹10,000</option>
        <option value="15000">Below ₹15,000</option>
    </select>

    <button onclick="filterRooms()">Search Rooms</button>
</section>

<section class="rooms-section">
    <h2>Available Properties</h2>

    <div class="property-grid" id="roomContainer"></div>

    <p id="noRooms" style="display:none; text-align:center;">
        No rooms found. Try another search.
    </p>
</section>

<footer>
    <p>© 2026 RentEase. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>

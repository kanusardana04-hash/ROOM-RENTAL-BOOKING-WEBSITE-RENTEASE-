<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Room | RentEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav class="navbar">
        <a href="index.html" class="logo">RentEase.</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="rooms.html">Explore Rooms</a>
            <a href="mybookings.html">My Bookings</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<section class="booking-section">

    <div class="booking-container">

        <h1>Complete Your Booking</h1>
        <p>Enter your details to submit a room booking request.</p>

        <div id="selectedRoomInfo"></div>

        <form id="bookingForm">

            <label>Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Mobile Number</label>
            <input type="tel" id="phone" placeholder="Enter 10-digit mobile number"
                   pattern="[0-9]{10}" maxlength="10" required>

            <label>Move-in Date</label>
            <input type="date" id="moveDate" required>

            <label>Additional Message</label>
            <textarea id="message" rows="4"
                placeholder="Any additional requirements (optional)"></textarea>

            <button type="submit" class="booking-submit">
                Submit Booking Request
            </button>

        </form>

    </div>

</section>

<footer>
    <p>© 2026 RentEase. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
